name: Docker Image CI

on:
  push:
    branches: 
      - "main" 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with: 
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
        
    - name: Login to Amazon ECR 
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
        
    - name: Setup Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.12.3
        pip-version: 24.0

    # - name: Docker Compose Build
    #   working-directory: ./
    #   run: docker compose build
    
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest .

    - name: List Docker Images
      run: docker images
      
    - name: Push to Docker Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:${{ github.run_id }}

        docker push ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:${{ github.run_id }}
        
    - name: Tag and Push Docker Image to Amazon ECR
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest ${{ secrets.IMAGE_REPO_URL }}:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}

        docker push ${{ secrets.IMAGE_REPO_URL }}:latest
        docker push ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}