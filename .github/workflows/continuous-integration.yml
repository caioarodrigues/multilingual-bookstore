name: Docker Image CI

on:
  push:
    branches: 
      - "main" 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with: 
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
        
    - name: Login to Amazon ECR 
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
        
    - name: Setup Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: 3.12.3
        pip-version: 24.0
    
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest .

    - name: List Docker Images
      run: docker images
      
    - name: Push to Docker Hub Container Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:${{ github.run_id }}

        docker push ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:${{ github.run_id }}
        
    - name: Tag and Push Docker Image to Amazon ECR
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest ${{ secrets.IMAGE_REPO_URL }}:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/multilingual-bookstore:latest ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}

        docker push ${{ secrets.IMAGE_REPO_URL }}:latest
        docker push ${{ secrets.IMAGE_REPO_URL }}:${{ github.run_id }}

    - name: Download task definition
      run: |
        aws ecs describe-task-definition --task-definition {{ secrets.TASK_DEFINITION_NAME }} --region us-east-1 --query taskDefinition > task-definition.json

    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ secrets.CONTAINER_NAME }}
        image: ${{ secrets.IMAGE_REPO_URL }}:latest

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ secrets.SERVICE_NAME }}
        cluster: ${{ secrets.CLUSTER_NAME }}
        wait-for-service-stability: true